name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20' # package.json engines: node >=20
          cache: npm
      # Dev-only install; the repo has no runtime dependencies and no test
      # reaches the network or reads a credential (see CLAUDE.md).
      - run: npm ci
      # package.json "test" = tsc --noEmit && vitest run. Both halves matter:
      # test/type-guards.test-d.ts asserts at compile time, so it fails tsc,
      # not vitest.
      #
      # THE DATA COMES FROM `checkout` AND FROM NOTHING ELSE. `config/data-root.mjs`
      # defaults to the copy in this repository, so a runner reads the tapes it
      # cloned; `SLOT_ZERO_DATA_ROOT` would point it somewhere else, and no step
      # here sets it. MEASURED against a root pointing at nothing: 12 of the 18
      # suites fail, so this job cannot pass without the tapes being reachable.
      # Untracking them therefore needs a decision about how a runner gets them
      # (a fetch step, a cache, or a reduced check set) — it is not a matter of
      # setting the variable.
      - run: npm test
