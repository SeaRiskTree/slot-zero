name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20' # package.json engines: node >=20
          cache: npm
      # Dev-only install; the repo has no runtime dependencies and no test
      # reaches the network or reads a credential (see CLAUDE.md).
      - run: npm ci
      # package.json "test" = tsc --noEmit && vitest run. Both halves matter:
      # test/type-guards.test-d.ts asserts at compile time, so it fails tsc,
      # not vitest.
      - run: npm test
